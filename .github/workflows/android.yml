name: Android build
on:
  workflow_dispatch:
  push:
    paths: ["mobile/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 360consultancy-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        working-directory: mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 360-consultancy.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest 360-consultancy.apk --title "Android app (test APK)" --notes "Debug build. Download 360-consultancy.apk"
